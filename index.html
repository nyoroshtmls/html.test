<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HTMLランナー">
<title>HTMLランナー</title>
<style>
:root{--wp:linear-gradient(160deg,#5b8def 0%,#8f5cf2 50%,#ee6fa0 100%);--sheet:#f2f2f7;--sfg:#1c1c1e;--row:#fff;--inp:#fff;--bd:#d8d8de;--ac:#0a84ff}
@media (prefers-color-scheme:dark){:root{--wp:linear-gradient(160deg,#1c2b57 0%,#3b2a73 50%,#6b2f55 100%);--sheet:#1c1c1e;--sfg:#f2f2f7;--row:#2c2c2e;--inp:#2c2c2e;--bd:#3a3a3c;--ac:#0a84ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#222}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif}
body::before{content:"";position:fixed;inset:0;background:var(--wp);z-index:-1}
#home{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 14px calc(env(safe-area-inset-bottom,0px) + 100px)}
#list{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app:active{opacity:.7}
.lb{font-size:11px;line-height:1.2;text-align:center;max-width:100%;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic{position:relative;overflow:hidden;border-radius:22.5%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.ic b{font-weight:600}
.im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.app>.ic{width:min(64px,100%);aspect-ratio:1;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mini{width:100%;aspect-ratio:1;font-size:10px}
.fold{width:min(64px,100%);aspect-ratio:1;border-radius:22.5%;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8%;display:grid;grid-template-columns:repeat(3,1fr);gap:5%;align-content:start;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.muted{opacity:.7;font-size:13px}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 28px);max-width:452px;height:56px;border-radius:28px;background:rgba(255,255,255,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:24px;z-index:2}
#dockadd{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:300;line-height:1;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none}
#dockadd:active{opacity:.6}
.plus{background:linear-gradient(135deg,#34c759,#30b0c7)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ov.c{align-items:center;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#asheet{z-index:7}
.sh{background:var(--sheet);color:var(--sfg);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);width:100%;max-width:520px;max-height:92vh;overflow:auto}
.sh h2{margin:0 0 12px;font-size:17px;text-align:center}
.sh input[type=text],.sh textarea,.sh select{width:100%;background:var(--inp);color:var(--sfg);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;font-size:16px}
.sh textarea{height:110px;font-family:monospace;font-size:13px}
.sh .muted{color:var(--sfg)}
.row{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.row select{flex:1}
.sh button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff}
.sh button.s{background:var(--row);color:var(--ac)}
.sh button.d{color:#ff453a}
.lst{display:flex;flex-direction:column;gap:8px}
.lst button{width:100%;background:var(--row);color:var(--ac);font-size:17px}
.lst button.d{color:#ff453a}
.fp{width:calc(100% - 40px);max-width:420px;text-align:center}
.fp h3{margin:0 0 16px;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;background:rgba(255,255,255,.2);border-radius:28px;padding:20px 12px;min-height:110px}
#run{display:none;position:fixed;inset:0;background:#000;flex-direction:column;z-index:5}
#run.in{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.9);border-radius:30px}}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(30,30,32,.95);color:#fff}
#bar b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#bar button{background:transparent;color:#0a84ff;border:0;padding:6px 8px;font:inherit;font-size:16px}
#fr{flex:1;width:100%;border:0;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="home">
<div id="list"><p class="muted">読み込み中…</p></div>
</div>
<div id="dock"><div id="dockadd" role="button" aria-label="追加">＋</div></div>

<div class="ov c" id="fo"><div class="fp"><h3 id="ft"></h3><div class="fgrid" id="fg"></div></div></div>

<div class="ov" id="addsh"><div class="sh">
<h2>HTMLを追加</h2>
<input type="text" id="name" placeholder="名前(例: minecraft-like.html)">
<div class="row"><select id="fsel"></select><button class="s" id="nf">＋フォルダ作成</button></div>
<div class="row"><span class="muted">画像(任意)</span><input type="file" id="imgf" accept="image/*"></div>
<div class="row"><input type="file" id="file" accept=".html,.htm,text/html"></div>
<textarea id="code" placeholder="またはここにHTMLを貼り付け"></textarea>
<div class="row"><button id="add">追加</button><button class="s" id="try">すぐ実行</button><button class="s" id="addx">閉じる</button></div>
<p class="muted">追加したHTMLはこの端末のブラウザに保存されます。</p>
</div></div>

<div class="ov" id="asheet"><div class="sh"><h2 id="at"></h2><div class="lst" id="al"></div></div></div>

<div id="run">
<div id="bar"><button id="back">‹ 戻る</button><b id="rt"></b><button id="rl">再読込</button></div>
<iframe id="fr" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals allow-popups" allow="fullscreen; gamepad"></iframe>
</div>

<script>
// HTMLは games/ フォルダに置くだけで自動で表示されます。
// 自動取得できない時は games/games.json(例: ["a.html","b.html"])を使います。
var DIR="games",$=function(i){return document.getElementById(i)},cur={u:"",h:null};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var BASE="ゲーム",KEY="html-runner-items",FK="html-runner-folders",saved=[],folders=[],files=[],all=[],openF=-1;
try{saved=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){saved=[]}
try{folders=JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){folders=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));localStorage.setItem(FK,JSON.stringify(folders))}catch(e){alert("保存できませんでした(今回だけ有効)")}}
function fl(){return [BASE].concat(folders)}
function opts(sel){return '<option value="">ホーム画面</option>'+fl().map(function(f){return '<option'+(f===sel?' selected':'')+'>'+esc(f)+'</option>'}).join("")}
var EXT=["png","jpg","jpeg","webp"];
function imgNext(el){var i=+el.getAttribute("data-i")+1;if(i<EXT.length){el.setAttribute("data-i",i);el.src=DIR+"/"+el.getAttribute("data-b")+"."+EXT[i]}else{el.style.display="none"}}
var gcache={},gp={},scache={};
function extractIcon(html,base){try{var d=new DOMParser().parseFromString(html,"text/html");var l=d.querySelector('link[rel~="icon"],link[rel="apple-touch-icon"]');var h=l&&l.getAttribute("href");if(!h)return"";if(/^(data:|https?:|blob:)/i.test(h))return h;return base?new URL(h,base).href:""}catch(e){return""}}
function favImg(u,n){return '<img class="im" alt="" src="'+esc(u)+'"'+(n!=null?' data-g="'+esc(n)+'"':'')+' onerror="this.style.display=\'none\'">'}
function thumb(e){
  if(e.h!==undefined){var k=e.n+":"+e.h.length;if(!(k in scache))scache[k]=extractIcon(e.h,"");return scache[k]?favImg(scache[k],null):(e.img?'<img class="im" src="'+e.img+'" alt="">':'')}
  if(e.g){if(gcache[e.n])return favImg(gcache[e.n],e.n);var b=encodeURIComponent(e.n.replace(/\.html?$/i,""));return '<img class="im" data-g="'+esc(e.n)+'" data-b="'+b+'" data-i="0" src="'+DIR+'/'+b+'.png" onerror="imgNext(this)" alt="">'}
  return e.img?'<img class="im" src="'+e.img+'" alt="">':''}
function loadIcons(){files.forEach(function(n){if(n in gcache||gp[n])return;gp[n]=1;var u=DIR+"/"+encodeURIComponent(n);fetch(u).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var ic=extractIcon(t,new URL(u,location.href).href);gcache[n]=ic;if(!ic)return;[].forEach.call(document.querySelectorAll("[data-g]"),function(el){if(el.getAttribute("data-g")===n){var w=document.createElement("div");w.innerHTML=favImg(ic,n);el.replaceWith(w.firstChild)}})}).catch(function(){gcache[n]=""})})}
function dn(n){return n.replace(/\.html?$/i,"")}
function grad(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return "linear-gradient(135deg,hsl("+h+" 70% 60%),hsl("+((h+40)%360)+" 70% 45%))"}
function tile(e,cls){return '<div class="ic '+cls+'" style="background:'+grad(e.n)+'"><b>'+esc(dn(e.n).charAt(0)||"?")+'</b>'+thumb(e)+'</div>'}
function app(e,j){return '<div class="app" data-r="'+j+'">'+tile(e,"")+'<span class="lb">'+esc(dn(e.n))+'</span></div>'}
function members(k){var f=fl()[k];return all.map(function(e,j){return{e:e,j:j}}).filter(function(x){return k===0?(x.e.g||x.e.f===BASE):(!x.e.g&&x.e.f===f)})}
function show(names){
  if(names)files=names.filter(function(n){return /\.html?$/i.test(n)}).sort();
  all=files.map(function(n){return{n:n,g:1}}).concat(saved.map(function(o,i){return{n:o.name,h:o.html,i:i,f:o.folder||"",img:o.img||""}}));
  var out="";
  fl().forEach(function(f,k){var m=members(k).slice(0,9);out+='<div class="app" data-f="'+k+'"><div class="fold">'+m.map(function(x){return tile(x.e,"mini")}).join("")+'</div><span class="lb">'+esc(f)+'</span></div>'});
  all.forEach(function(e,j){if(!e.g&&fl().indexOf(e.f)<0)out+=app(e,j)});
  $("list").innerHTML=out;
  $("fsel").innerHTML=opts($("fsel").value);
  if(openF>=0)renderFolder();
  if(names)loadIcons();
}
function renderFolder(){var m=members(openF);$("ft").textContent=fl()[openF];
  $("fg").innerHTML=m.map(function(x){return app(x.e,x.j)}).join("")||'<p class="muted" style="grid-column:1/-1">'+(openF===0?'games フォルダにHTMLを置くとここに出ます':'空のフォルダ')+'</p>';$("fo").classList.add("on")}
function closeFolder(){openF=-1;$("fo").classList.remove("on")}
function sheet(title,items){$("at").textContent=title;$("al").innerHTML="";items.concat([{t:"キャンセル",fn:function(){}}]).forEach(function(it){var b=document.createElement("button");b.textContent=it.t;if(it.d)b.className="d";b.onclick=function(){$("asheet").classList.remove("on");it.fn()};$("al").appendChild(b)});$("asheet").classList.add("on")}
function longPress(t){var r=t.getAttribute("data-r"),f=t.getAttribute("data-f");
  if(r!==null){var e=all[+r];if(e.h===undefined)return;
    sheet(dn(e.n),[{t:"フォルダへ移動",fn:function(){moveSheet(e)}},{t:"削除",d:1,fn:function(){if(confirm("「"+dn(e.n)+"」を削除しますか?")){saved.splice(e.i,1);persist();show()}}}])}
  else if(f!==null&&+f>0){var nm=folders[+f-1];
    sheet("フォルダ「"+nm+"」",[{t:"フォルダを削除(中身はホーム画面へ)",d:1,fn:function(){saved.forEach(function(o){if(o.folder===nm)o.folder=""});folders.splice(+f-1,1);closeFolder();persist();show()}}])}}
function moveSheet(e){var items=[{t:"ホーム画面",fn:function(){saved[e.i].folder="";persist();show()}}];
  fl().forEach(function(f){items.push({t:"📁 "+f,fn:function(){saved[e.i].folder=f;persist();show()}})});sheet("移動先",items)}
var lp=0,lpf=false,px=0,py=0;
document.addEventListener("pointerdown",function(ev){var t=ev.target.closest&&ev.target.closest("#list [data-r],#list [data-f],#fg [data-r]");if(!t)return;lpf=false;px=ev.clientX;py=ev.clientY;clearTimeout(lp);lp=setTimeout(function(){lpf=true;longPress(t)},550)});
document.addEventListener("pointermove",function(ev){if(lp&&(Math.abs(ev.clientX-px)>10||Math.abs(ev.clientY-py)>10)){clearTimeout(lp);lp=0}});
["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,function(){clearTimeout(lp);lp=0})});
document.addEventListener("contextmenu",function(ev){if(ev.target.closest&&ev.target.closest(".app"))ev.preventDefault()});
document.addEventListener("click",function(ev){
  if(lpf){lpf=false;ev.preventDefault();return}
  var t=ev.target;
  if(t===$("fo")){closeFolder();return}
  if(t.classList&&t.classList.contains("ov")&&t!==$("fo")){t.classList.remove("on");return}
  var a=t.closest&&t.closest("[data-r],[data-f],#dockadd");if(!a)return;
  if(a.id==="dockadd"){$("fsel").innerHTML=opts("");$("addsh").classList.add("on");return}
  var f=a.getAttribute("data-f");if(f!==null){openF=+f;renderFolder();return}
  var e=all[+a.getAttribute("data-r")];e.h!==undefined?openGame(e.n,null,e.h):openGame(e.n,DIR+"/"+encodeURIComponent(e.n),null)});
$("nf").onclick=function(){var n=(prompt("フォルダ名")||"").trim();if(!n)return;if(n!==BASE&&folders.indexOf(n)<0){folders.push(n);persist()}show();$("fsel").value=n};
function load(){var f=$("fr");if(cur.h!==null){f.srcdoc=cur.h}else{f.removeAttribute("srcdoc");f.src=cur.u}}
function blank(){var f=$("fr");f.removeAttribute("srcdoc");f.src="about:blank"}
function openGame(n,u,h){cur={u:u,h:h};$("rt").textContent=dn(n);load();var r=$("run");r.style.display="flex";r.classList.remove("in");void r.offsetWidth;r.classList.add("in")}
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("code").value=r.result;if(!$("name").value)$("name").value=f.name};r.readAsText(f)};
$("add").onclick=function(){var h=$("code").value.trim();if(!h)return alert("HTMLを入れてください");var f=$("imgf").files[0];
function fin(img){saved.push({name:$("name").value.trim()||"無題.html",html:h,folder:$("fsel").value,img:img||""});persist();$("code").value="";$("name").value="";$("file").value="";$("imgf").value="";$("addsh").classList.remove("on");show()}
if(!f)return fin("");
var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),k=Math.min(1,160/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);fin(c.toDataURL("image/jpeg",0.7))};im.onerror=function(){fin("")};im.src=r.result};r.readAsDataURL(f)};
$("try").onclick=function(){var h=$("code").value.trim();if(h){$("addsh").classList.remove("on");openGame($("name").value||"プレビュー",null,h)}};
$("addx").onclick=function(){$("addsh").classList.remove("on")};
function fromApi(){
  var host=location.hostname,path=location.pathname.split("/")[1];
  if(!/\.github\.io$/.test(host)||!path)return Promise.reject();
  return fetch("https://api.github.com/repos/"+host.split(".")[0]+"/"+path+"/contents/"+DIR)
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(a){return a.map(function(f){return f.name})});
}
function fromJson(){return fetch(DIR+"/games.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})}
show([]);
fromApi().catch(fromJson).then(show).catch(function(){show([])});
$("back").onclick=function(){$("run").style.display="none";blank()};
$("rl").onclick=function(){blank();setTimeout(load,30)};
</script>
</body>
</html>
